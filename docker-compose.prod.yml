# Docker Compose untuk Production (menggunakan pre-built images)
# Gunakan file ini jika sudah meng-import Docker images ke server

networks:
  default:
    name: isp-app_default
    external: false

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: isp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-isp_app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application (menggunakan pre-built image)
  app:
    image: isp-app-app:latest  # Menggunakan image yang sudah di-import
    container_name: isp-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-isp_app}?schema=public
      XENDIT_SECRET_KEY: ${XENDIT_SECRET_KEY}
      XENDIT_CALLBACK_TOKEN: ${XENDIT_CALLBACK_TOKEN}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution-api:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-isp-app}
      NODE_ENV: production
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      evolution-api:
        condition: service_started
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 10 &&
        npx prisma migrate deploy || echo 'Migration failed or already applied' &&
        echo 'Starting application...' &&
        node server.js
      "

  # EvolutionAPI Service
  evolution-api:
    image: atendai/evolution-api:latest
    container_name: isp-evolution-api
    restart: unless-stopped
    ports:
      - "${EVOLUTION_API_PORT:-8080}:8080"
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-ubah-saya}
      SERVER_URL: ${SERVER_URL:-http://localhost:3000}
      WEBHOOK_GLOBAL_URL: ${WEBHOOK_GLOBAL_URL:-http://localhost:3000/api/webhooks/evolution}
      WEBHOOK_GLOBAL_ENABLED: ${WEBHOOK_GLOBAL_ENABLED:-true}
      CONFIG_SESSION_PHONE_CLIENT: EvolutionAPI
      CONFIG_SESSION_PHONE_NAME: ${EVOLUTION_INSTANCE_NAME:-isp-app}
    volumes:
      - evolution_store:/evolution/store
      - evolution_instances:/evolution/instances
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  evolution_store:
    driver: local
  evolution_instances:
    driver: local



